<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikvision DVR Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hikvision DVR Viewer</h1>
            <p>Find the DVR, connect once, then view its camera channels.</p>
        </header>

        <main class="main-content">
            <section class="scan-section">
                <div class="section-title">
                    <div>
                        <h2>DVR Scanner</h2>
                        <p id="status">Ready</p>
                    </div>
                    <button class="btn primary" id="btnScan" type="button">Scan Hikvision DVRs</button>
                </div>
                <div class="progress-bar" aria-hidden="true">
                    <div class="progress" id="progressBar"></div>
                </div>
                <div class="dvr-list" id="dvrList"></div>
            </section>

            <section class="connect-section">
                <h2>Connect To DVR</h2>
                <div class="connect-grid">
                    <label>
                        <span>DVR IP address</span>
                        <input type="text" id="dvrIpInput" inputmode="numeric" placeholder="192.168.1.4" value="192.168.1.4">
                    </label>
                    <label>
                        <span>HTTP port</span>
                        <input type="number" id="dvrPortInput" min="1" max="65535" value="80">
                    </label>
                    <label>
                        <span>Username</span>
                        <input type="text" id="usernameInput" autocomplete="username" value="admin">
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Try default if empty">
                    </label>
                    <button class="btn secondary" id="connectBtn" type="button">Connect</button>
                </div>
            </section>

            <section class="dvr-section" id="dvrSection">
                <h2 id="dvrTitle">DVR Channels</h2>
                <div class="cameras-grid" id="channelsGrid">
                    <div class="no-cameras">Connect to the Hikvision DVR to load its channels.</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Hikvision DVR Viewer - Local Network Monitoring</p>
        </footer>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
